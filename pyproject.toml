[project]
name = "uniclogs-cesium-backend"
description = "Backend API for the UniClOGS Cesium Frontend."
version = "2.0.0"

readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = "GPL-2.0"

dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "skyfield==1.55",
    "pygeoif==0.7",
    "dataclasses-json==0.6.7",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "satellite-czml==0.1.2",
]

[project.optional-dependencies]
ci = ["ruff==0.16.5", "pytest==9.1.1"]
docker = ["build==1.6.1", "gunicorn==26.2.0"]


[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
